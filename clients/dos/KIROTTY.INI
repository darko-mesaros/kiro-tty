; KIROTTY.INI - dial Kiro TTY through a WiFi modem on COM1.
; Run with KIROTTY.BAT (or: MSK316 take kirotty.ini).
; Edit the four DEFINE lines to match your setup.

define _ktport COM1
define _ktspeed 300
define _kthost 192.168.1.219
define _ktportno 6401

set port \m(_ktport)
set speed \m(_ktspeed)
set parity none
set flow xon/xoff
set terminal type vt102
set terminal wrap on

echo Dialing Kiro TTY at \m(_kthost):\m(_ktportno) ...
output ATDT\m(_kthost):\m(_ktportno)\13
input 30 CONNECT
if fail echo No CONNECT from the modem. Check speed, cable and IP.
if fail stop
connect
; Ctrl-] then C returns to the MS-Kermit> prompt; type EXIT to quit.
